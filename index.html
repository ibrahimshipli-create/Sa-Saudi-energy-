function renderDashboard() {
    const stats = {
        total: state.requests.length,
        pending: state.requests.filter(r => r.status === 'قيد الانتظار').length,
        progress: state.requests.filter(r => r.status === 'قيد التنفيذ').length,
        completed: state.requests.filter(r => r.status === 'مكتمل').length
    };

    return `
        <div class="info-banner">✅ ${state.requests.length} طلب في النظام | 📊 ${stats.completed} مكتملة | ⚙️ ${stats.progress} قيد التنفيذ</div>
        <div class="grid">
            <div class="stat-card"><h3>📊 الإجمالي</h3><div class="value">${stats.total}</div></div>

            <div class="stat-card"><h3>⚙️ التنفيذ</h3><div class="value">${stats.progress}</div></div>
            <div class="stat-card"><h3>✅ المكتملة</h3><div class="value">${stats.completed}</div></div>
        </div>
    `;
}

function renderRequests() {

            <input type="search" id="search" placeholder="ابحث..." oninput="search()">

                </tbody>
            </table>
        </div>
    `;
}

function handleImages(e) {
const files = Array.from(e.target.files);
files.forEach(file => {
const reader = new FileReader();
reader.onload = function(event) {
state.newImages.push({
name: file.name,
data: event.target.result
});
renderImageList();
};
reader.readAsDataURL(file);
});
}

function renderImageList() {
const list = document.getElementById(‘imageList’);
if (list) {
list.innerHTML = state.newImages.map((img, i) => `<div class="file-item"> <img src="${img.data}" alt="صورة"> <span>${img.name}</span> </div>`).join(’’);
}
}

function login(name) { state.loggedIn = true; state.user = name; state.activeTab = ‘dashboard’; render(); }

function closeModal() { state.showModal = false; state.editId = null; state.newImages = []; render(); }
